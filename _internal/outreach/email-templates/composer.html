<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purebaric outreach email composer</title>
<style>
:root{--ink:#2b2320;--muted:#6f635b;--cream:#f7f2ea;--cream2:#efe7db;--terra:#b8654d;--terra-d:#9a4f3a;--terra-bg:#f4e7df;--line:#e6dccd;--card:#fffdf9}
*{box-sizing:border-box}
body{margin:0;background:var(--cream2);font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5}
.top{position:sticky;top:0;z-index:2;background:var(--ink);color:#f7f2ea;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top strong{font-size:15px;margin-right:auto}
.top button,.top a.btn{background:var(--terra);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.top button.ghost{background:transparent;border:1px solid rgba(255,255,255,.4)}
.top #msg{font-size:13px;color:#e6dac8;width:100%}
.layout{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 62px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 20px}
.side h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-d);margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.subjects{margin-top:18px}
.subj{display:flex;gap:8px;align-items:flex-start;background:var(--terra-bg);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:13.5px}
.subj button{flex:none;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--terra-d);font-weight:700}
.preview{padding:0;background:var(--cream2)}
iframe{width:100%;height:calc(100vh - 62px);border:0;display:block}
.warn{background:#fff6e5;border:1px solid #f1d7a3;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-top:16px;color:#6b4e12}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}iframe{height:900px}}
</style></head>
<body>
<div class="top">
  <strong>Purebaric outreach email</strong>
  <button id="copyHtml">Copy email for Gmail</button>
  <button id="copyText" class="ghost">Copy plain text</button>
  <button id="dl" class="ghost">Download .html</button>
  <span id="msg">Pick an industry, fill in the business, then copy and paste into a new Gmail message. Attach purebaric_facility_prospectus.pdf.</span>
</div>
<div class="layout">
  <aside class="side">
    <h2>Personalize</h2>
    <label for="cat">Industry</label>
    <select id="cat"></select>
    <label for="first">First name</label>
    <input id="first" placeholder="[First name]" autocomplete="off">
    <label for="biz">Business name</label>
    <input id="biz" placeholder="[Business name]" autocomplete="off">
    <div class="subjects">
      <h2>Subject lines</h2>
      <div id="subjects"></div>
    </div>
    <div class="warn" id="warn" hidden>Fill in the first name and business name before copying. Unfilled tokens are highlighted in the preview.</div>
  </aside>
  <main class="preview"><iframe id="frame" title="Email preview"></iframe></main>
</div>
<div id="stage" style="position:absolute;left:-9999px;top:0;width:600px;"></div>
<script>
var DATA=[{"id":"gyms-and-fitness","label":"Gyms and fitness centers","subjects":["A new revenue line for [Business name] that fits in a 4 x 8 ft corner","Keep the recovery spend your members take across town","Hyperbaric on your gym floor, no chamber to buy"],"html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Purebaric for gyms and fitness centers</title>\n<style>\n  @media only screen and (max-width:480px) {\n    .pb-stack { display:block !important; width:100% !important; padding:0 0 8px !important; }\n    .pb-gap { display:none !important; }\n    .pb-pad { padding-left:24px !important; padding-right:24px !important; }\n  }\n</style>\n</head>\n<body style=\"margin:0; padding:0; background:#efe7db; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#2b2320; line-height:1.6;\">\n  <!-- Subject: A new revenue line for [Business name] that fits in a 4 x 8 ft corner -->\n  <div style=\"display:none; font-size:1px; color:#efe7db; line-height:1px; max-height:0; max-width:0; overflow:hidden;\">Members already pay recovery studios $79 to $129 a session for hyperbaric. Put it on your floor and keep that revenue.</div>\n  <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#efe7db;\">\n    <tr>\n      <td align=\"center\" style=\"padding:28px 12px;\">\n        <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"560\" style=\"max-width:560px; width:100%; background:#fffdf9; border:1px solid #e6dccd; border-radius:16px; overflow:hidden;\">\n\n          <!-- Header -->\n          <tr>\n            <td align=\"center\" style=\"background:#2b2320; padding:22px 40px; text-align:center;\">\n              <a href=\"https://purebaric.com/business?utm_source=email&utm_medium=outreach&utm_campaign=b2b-gyms-and-fitness\" style=\"text-decoration:none;\">\n                <img src=\"https://purebaric.com/images/logo-cream.png?v=3\" alt=\"Purebaric\" width=\"220\" style=\"display:block; margin:0 auto; height:auto; max-width:220px; border:0; outline:none; text-decoration:none;\" />\n              </a>\n            </td>\n          </tr>\n\n          <!-- Hero image, full card width -->\n          <tr>\n            <td align=\"center\" style=\"padding:0; line-height:0; font-size:0;\">\n              <img src=\"https://purebaric.com/images/chamber-living.jpg\" alt=\"A Purebaric 1.5 ATA hyperbaric chamber\" width=\"560\" style=\"display:block; width:100%; max-width:560px; height:auto; border:0;\" />\n            </td>\n          </tr>\n\n          <!-- Headline, opener, first CTA -->\n          <tr>\n            <td class=\"pb-pad\" style=\"padding:30px 40px 6px;\">\n              <p style=\"margin:0 0 8px; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; font-weight:700; color:#9a4f3a;\">A new profit line for gyms</p>\n              <h1 style=\"margin:0 0 18px; font-family:Georgia,'Times New Roman',serif; font-size:27px; line-height:1.22; font-weight:700; color:#2b2320;\">Turn a 4 x 8 ft corner of your business into a new profit line</h1>\n              <p style=\"margin:0 0 14px; font-size:16px;\">Hi [First name],</p>\n              <p style=\"margin:0 0 14px; font-size:16px;\">Your members are already paying recovery studios $79 to $129 an hour for hyperbaric sessions. One chamber in a 4 x 8 ft corner makes that revenue yours.</p>\n              <p style=\"margin:0 0 20px; font-size:16px;\">Purebaric is a Lehi company. We deliver and install mild hyperbaric chambers, train your staff, and provide ongoing service and support. With minimal upfront cost, the chamber becomes a lucrative revenue stream for your business. <a href=\"https://purebaric.com/business?utm_source=email&utm_medium=outreach&utm_campaign=b2b-gyms-and-fitness\" style=\"color:#9a4f3a; text-decoration:underline;\">See the numbers for businesses.</a></p>\n              <p style=\"margin:0 0 6px;\"><a href=\"https://purebaric.com/book?type=business&utm_source=email&utm_medium=outreach&utm_campaign=b2b-gyms-and-fitness\" style=\"display:inline-block; padding:14px 22px; background:#b8654d; color:#ffffff; text-decoration:none; border-radius:8px; font-weight:700; font-size:16px; white-space:nowrap;\">Reserve a chamber</a></p>\n              <p style=\"margin:0 0 10px; font-size:13px; color:#6f635b;\">No charge until we confirm a delivery date.</p>\n            </td>\n          </tr>\n\n          <!-- Tiles -->\n          <tr>\n            <td class=\"pb-pad\" style=\"padding:14px 40px 6px;\">\n              <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#b8654d; border-top:4px solid #2b2320; border-radius:10px;\">\n  <tr><td style=\"padding:18px 22px 20px;\">\n    <p style=\"margin:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; font-weight:700; color:#ffffff; white-space:nowrap;\">Estimated net revenue</p>\n    <p style=\"margin:0; font-family:Georgia,'Times New Roman',serif; font-size:38px; line-height:1.1; font-weight:700; color:#ffffff;\">$6,686 <span style=\"font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:700;\">per month</span></p>\n    <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"margin-top:8px;\"><tr><td width=\"14\" valign=\"top\" style=\"width:14px; padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">&bull;</td><td style=\"padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">4 sessions a day at the recommended rate</td></tr><tr><td width=\"14\" valign=\"top\" style=\"width:14px; padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">&bull;</td><td style=\"padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">2 sessions a day: an estimated $2,853 net</td></tr><tr><td width=\"14\" valign=\"top\" style=\"width:14px; padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">&bull;</td><td style=\"padding:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; color:#ffffff;\">Estimates, not guarantees</td></tr></table>\n  </td></tr>\n</table>\n              <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"margin-top:10px;\">\n                <tr>\n                  <td class=\"pb-stack\" width=\"32%\" valign=\"top\" style=\"width:32%;\"><table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#f4e7df; border-top:4px solid #b8654d; border-radius:10px;\">\n  <tr><td style=\"padding:12px 14px 14px;\">\n    <p style=\"margin:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; color:#9a4f3a; white-space:nowrap;\">Your cost</p>\n    <p style=\"margin:0; font-family:Georgia,'Times New Roman',serif; font-size:20px; line-height:1.1; font-weight:700; color:#2b2320;\">$979 <span style=\"font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; font-weight:700;\">per month</span></p>\n    <p style=\"margin:6px 0 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.45; color:#2b2320;\">12-month rental, service included</p>\n  </td></tr>\n</table></td>\n                  <td class=\"pb-gap\" width=\"2%\" style=\"width:2%; font-size:0; line-height:0;\">&nbsp;</td>\n                  <td class=\"pb-stack\" width=\"32%\" valign=\"top\" style=\"width:32%;\"><table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#f4e7df; border-top:4px solid #b8654d; border-radius:10px;\">\n  <tr><td style=\"padding:12px 14px 14px;\">\n    <p style=\"margin:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; color:#9a4f3a; white-space:nowrap;\">Break-even</p>\n    <p style=\"margin:0; font-family:Georgia,'Times New Roman',serif; font-size:20px; line-height:1.1; font-weight:700; color:#2b2320;\">14 sessions</p>\n    <p style=\"margin:6px 0 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.45; color:#2b2320;\">a month covers the rental</p>\n  </td></tr>\n</table></td>\n                  <td class=\"pb-gap\" width=\"2%\" style=\"width:2%; font-size:0; line-height:0;\">&nbsp;</td>\n                  <td class=\"pb-stack\" width=\"32%\" valign=\"top\" style=\"width:32%;\"><table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#f4e7df; border-top:4px solid #b8654d; border-radius:10px;\">\n  <tr><td style=\"padding:12px 14px 14px;\">\n    <p style=\"margin:0 0 3px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; color:#9a4f3a; white-space:nowrap;\">Space needed</p>\n    <p style=\"margin:0; font-family:Georgia,'Times New Roman',serif; font-size:20px; line-height:1.1; font-weight:700; color:#2b2320;\">4 x 8 ft</p>\n    <p style=\"margin:6px 0 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.45; color:#2b2320;\">and a standard wall outlet</p>\n  </td></tr>\n</table></td>\n                </tr>\n              </table>\n              \n            </td>\n          </tr>\n\n          <!-- Included -->\n          <tr>\n            <td class=\"pb-pad\" style=\"padding:22px 40px 0;\">\n              <p style=\"margin:0 0 8px; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; font-weight:700; color:#9a4f3a;\">Included in the rental</p>\n              <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\">\n<tr>\n  <td width=\"16\" valign=\"top\" style=\"width:16px; padding:4px 0 0;\"><span style=\"display:inline-block; width:9px; height:9px; border-radius:50%; background:#b8654d;\"></span></td>\n  <td style=\"padding:0 0 8px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; color:#5f544d;\"><strong style=\"color:#2b2320;\">Delivery, installation, and staff training</strong> with a written guide, within days.</td>\n</tr>\n<tr>\n  <td width=\"16\" valign=\"top\" style=\"width:16px; padding:4px 0 0;\"><span style=\"display:inline-block; width:9px; height:9px; border-radius:50%; background:#b8654d;\"></span></td>\n  <td style=\"padding:0 0 8px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; color:#5f544d;\"><strong style=\"color:#2b2320;\">Consent forms and a client pamphlet</strong> in your brand, ready for your front desk.</td>\n</tr>\n<tr>\n  <td width=\"16\" valign=\"top\" style=\"width:16px; padding:4px 0 0;\"><span style=\"display:inline-block; width:9px; height:9px; border-radius:50%; background:#b8654d;\"></span></td>\n  <td style=\"padding:0 0 8px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; color:#5f544d;\"><strong style=\"color:#2b2320;\">Service and support.</strong> If anything stops working, we fix it. Staff time is about 15 minutes per session.</td>\n</tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Bottom CTA -->\n          <tr>\n            <td class=\"pb-pad\" style=\"padding:22px 40px 8px;\">\n              <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"background:#2b2320; border-radius:14px;\">\n                <tr>\n                  <td style=\"padding:22px 24px 20px;\">\n                    <p style=\"margin:0 0 6px; font-family:Georgia,'Times New Roman',serif; font-size:20px; line-height:1.25; font-weight:700; color:#ffffff;\">Ready to add it to [Business name]?</p>\n                    <p style=\"margin:0 0 16px; font-size:15px; line-height:1.55; color:#e6dac8;\">Reserve a chamber and we will confirm a delivery date and walk your team through setup. There is no charge until we confirm your booking. Prefer to talk through your space first? Call or text.</p>\n                    <p style=\"margin:0 0 12px;\"><a href=\"https://purebaric.com/book?type=business&utm_source=email&utm_medium=outreach&utm_campaign=b2b-gyms-and-fitness\" style=\"display:inline-block; padding:14px 22px; background:#b8654d; color:#ffffff; text-decoration:none; border-radius:8px; font-weight:700; font-size:16px; white-space:nowrap;\">Reserve a chamber</a></p>\n                    <p style=\"margin:0; font-size:14px; color:#e6dac8;\">Call or text <a href=\"tel:+18019010873\" style=\"color:#ffffff; text-decoration:underline;\">(801) 901-0873</a> &nbsp;·&nbsp; <a href=\"https://purebaric.com/purebaric-business-prospectus.pdf\" style=\"color:#ffffff; text-decoration:underline;\">Business prospectus (PDF)</a></p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Signature -->\n          <tr>\n            <td class=\"pb-pad\" style=\"padding:18px 40px 30px;\">\n              <table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\n
