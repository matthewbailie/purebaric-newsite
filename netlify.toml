[build]
  command = "npm test"
  publish = "."
  functions = "netlify/functions"

# ───────── Caching: images change rarely, cache them for a week ─────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ───────── Internal docs (never served publicly) ─────────
[[redirects]]
  from = "/_internal/*"
  to = "/"
  status = 404
  force = true

# ───────── Public API ─────────
[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

