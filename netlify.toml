# The admin Outreach tab imports its prospect list from this file (built by
# _internal/outreach/source/make_prospect_list.py), so it ships inside the function bundle.
[functions."admin-outreach"]
  included_files = ["_internal/outreach/prospects.json"]

# ───────── Scheduled function ─────────
# Auto-expires waitlist holds and transitions rentals by date. Runs hourly.
[functions."expire-holds"]
  schedule = "0 * * * *"

# Weekly digest (email + text) of running rentals ending within the next 10 days.
# Mondays at 15:00 UTC (9:00 AM Utah in summer, 8:00 AM in winter).
[functions."rental-ending-notify"]
  schedule = "0 15 * * 1"

# Business outreach scheduling is disabled. Resend prohibits cold outreach.
# Customer notifications and the rental maintenance schedules above remain enabled.
